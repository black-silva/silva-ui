name: create-silva-ui

on:
  pull_request:
    paths:
      - "packages/create-silva-ui/**"
      - ".github/workflows/create-silva-ui.yml"
  push:
    branches: [main]
    paths:
      - "packages/create-silva-ui/**"

jobs:
  matrix-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
        working-directory: packages/create-silva-ui
      - run: npm test
        working-directory: packages/create-silva-ui
