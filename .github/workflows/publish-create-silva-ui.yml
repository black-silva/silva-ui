name: Publish create-silva-ui

on:
  push:
    branches: [main]
    paths:
      - packages/create-silva-ui/**
      - .github/workflows/publish-create-silva-ui.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-silva-ui-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-silva-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check whether this version exists
        id: published
        run: |
          if npm view "$(node -p \"require(./package.json).name\")@$(node -p \"require(./package.json).version\")" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.published.outputs.exists != true
        run: npm publish --access public
