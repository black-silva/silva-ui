name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check whether the package version changed
        id: version
        run: |
          current_version=$(node -p "require('./package.json').version")
          previous_version=$(git show HEAD^:package.json | node -e "let source = ''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => console.log(JSON.parse(source).version))")

          if [ "$current_version" = "$previous_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Package version is unchanged ($current_version); skipping publication."
          else
            node - "$previous_version" "$current_version" <<'NODE'
            const [previous, current] = process.argv.slice(2);
            const parse = value => {
              const match = value.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
              if (!match) throw new Error(`Not a semantic version: ${value}`);
              return { core: match.slice(1, 4).map(Number), prerelease: match[4] };
            };
            const oldVersion = parse(previous);
            const newVersion = parse(current);
            for (let index = 0; index < 3; index += 1) {
              if (newVersion.core[index] !== oldVersion.core[index]) process.exit(newVersion.core[index] > oldVersion.core[index] ? 0 : 1);
            }
            if (oldVersion.prerelease && !newVersion.prerelease) process.exit(0);
            if (!oldVersion.prerelease && newVersion.prerelease) process.exit(1);
            process.exit(newVersion.prerelease > oldVersion.prerelease ? 0 : 1);
            NODE

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Package version changed: $previous_version -> $current_version"
          fi

  publish:
    name: Build and publish
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build:package

      - name: Read package version
        id: package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: published
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public

      - name: Report existing version
        if: steps.published.outputs.exists == 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already on npm; bump the version before releasing."
