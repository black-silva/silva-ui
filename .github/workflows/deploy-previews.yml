name: Deploy documentation previews

# Builds the Hono JSX preview app from Silva UI source, then publishes it for Mintlify.
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'src/**'
      - 'vite.previews.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-previews.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Silva UI preview app
        run: npm run build:previews
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
