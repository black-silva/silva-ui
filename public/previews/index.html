<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silva UI live previews</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe4ee;--primary:#0f766e;--primary-ink:#fff;--shadow:0 8px 22px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;padding:20px}.demo{max-width:760px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}h1,h2,h3,p{margin:0}h2{font-size:18px}h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.stack{display:grid;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}.subtle{background:#f1f5f9}.button{border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);border-radius:9px;padding:8px 12px;font:inherit;font-weight:650;cursor:pointer}.button.outline{background:#fff;color:var(--primary)}.button.ghost{background:transparent;color:var(--primary);border-color:transparent}.field{display:grid;gap:6px;font-weight:600}.input,textarea,select{font:inherit;color:var(--text);width:100%;border:1px solid #b9c7d6;border-radius:8px;padding:9px;background:#fff}textarea{min-height:76px;resize:vertical}.checkbox,.radio{display:flex;gap:8px;align-items:center;font-weight:400}.progress{height:9px;overflow:hidden;background:#e2e8f0;border-radius:999px}.progress span{display:block;height:100%;width:56%;background:var(--primary);border-radius:inherit}.avatar{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#cbd5e1;color:#334155;font-weight:700}.avatar.photo{background:linear-gradient(135deg,#f59e0b,#e879f9,#22c55e);color:#fff}.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.list .item{padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.list .item:last-child{border:0}.spinner{width:28px;height:28px;border:3px solid #cbd5e1;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}.loader{height:5px;background:#dbeafe;border-radius:99px;overflow:hidden}.loader:after{content:"";display:block;width:42%;height:100%;background:var(--primary);animation:slide 1.2s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(340%)}}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:9px 10px;color:var(--muted);cursor:pointer}.tab.active{color:var(--primary);border-bottom:2px solid var(--primary);font-weight:700}.tabpanel{padding-top:14px}.dialog-backdrop{background:rgba(15,23,42,.08);border-radius:10px;padding:18px}.dialog{max-width:420px;margin:auto;padding:18px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.xgroup{display:inline-flex}.xgroup .button{border-radius:0}.xgroup .button:first-child{border-radius:9px 0 0 9px}.xgroup .button:last-child{border-radius:0 9px 9px 0}.sep{height:1px;background:var(--line);border:0;width:100%}.theme{background:#12201f;color:#e5fffb;border-color:#275750}.theme .panel{background:#1d302f;color:#e5fffb;border-color:#3a615d}.theme .muted{color:#a4c5c1}.toast{border-left:4px solid #22c55e}.notice{padding:10px 12px;border-radius:9px;background:#ecfdf5;color:#065f46}.swatches{display:flex;gap:8px}.swatch{padding:15px 10px;border-radius:8px;color:#fff;font-size:12px;font-weight:700}.a{background:#0f766e}.b{background:#14b8a6}.c{background:#0f172a}.server{background:#0f172a;color:#d1fae5;border-radius:10px;padding:14px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.server b{color:#5eead4}.gradient{color:#fff;border:0;background:linear-gradient(135deg,#6e56cf,#8e4ec6,#00bcd4)}.gradient-light{color:#fff;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6)}.gradient-dark{color:#fff;border:0;background:linear-gradient(135deg,#a78bfa,#7c3aed)}.gradient-brand{color:#fff;border:0;background:linear-gradient(135deg,#7c3aed,#5b21b6)}.gradient-radial{color:#fff;border:0;background:radial-gradient(circle at 30% 25%,#14b8a6,#0f766e 52%,#f8fafc 53%)}.gradient-conic{color:#fff;border:0;background:conic-gradient(from 45deg,#8b5cf6,#06b6d4,#8b5cf6)}.gradient-text{font-size:30px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(90deg,#06b6d4,#2563eb,#4f46e5);color:transparent;background-clip:text;-webkit-background-clip:text}.token-mark{width:clamp(40px,16vw,80px);height:clamp(40px,16vw,80px);border-radius:clamp(8px,2.4vw,12px);background:#0f766e}.interactive{cursor:pointer;outline:0;transition:.16s ease}.interactive:hover,.interactive:focus{background:#ccfbf1;color:#134e4a;box-shadow:0 0 0 3px #5eead4}.motion-card{animation:slideup .36s ease-out both}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes slideup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.45}}@media(max-width:440px){.shell{padding:10px}.demo{padding:15px}}
</style></head>
<body><main class="shell"><section class="demo" id="app"></section></main>
<script>
const example=location.hash.slice(1)||new URLSearchParams(location.search).get('example')||'default';const app=document.querySelector('#app');const button=(label,kind='')=>`<button class="button ${kind}" type="button">${label}</button>`;const card=(content,extra='')=>`<div class="panel ${extra}">${content}</div>`;const title=(name,sub='Rendered visual result')=>`<div class="stack"><div><h2>${name}</h2><p class="muted small">${sub}</p></div>`;const end='</div>';
const previews={
'display-1':()=>title('Card')+card(`<div class="stack"><div class="row between"><div><h3>Storage</h3><p class="muted">18 GB of 50 GB used</p></div></div><div class="progress"><span style="width:36%"></span></div><div>${button('Manage storage','outline')}</div></div>`)+end,
'display-2':()=>title('Avatar and image')+`<div class="row"><div class="avatar photo">BS</div><div class="stack"><div class="panel subtle" style="width:210px;height:80px;display:grid;place-items:center;color:#475569">Product banner</div><p class="muted small">Image with fallback avatar</p></div></div>`+end,
'display-3':()=>title('List item')+`<div class="list"><div class="item"><div class="avatar" style="width:32px;height:32px">BS</div><div><b>BlackSilva</b><div class="muted small">Owner</div></div></div></div>`+end,
'display-4':()=>title('Loading states')+`<div class="row"><div class="spinner"></div><div class="stack" style="flex:1"><span class="muted small">Saving your changes</span><div class="loader"></div></div></div>`+end,
'forms-1':()=>title('Subscribe form')+`<form class="stack" onsubmit="event.preventDefault();this.querySelector('.notice').hidden=false"><label class="field">Email address<input class="input" type="email" placeholder="you@example.com" required></label><p class="muted small">We will only send product updates.</p>${button('Subscribe')}<p class="notice" hidden>Subscribed locally for this preview.</p></form>`+end,
'forms-2':()=>title('Message field')+`<label class="field">Message<textarea placeholder="Tell us what you need."></textarea></label>`+end,
'forms-3':()=>title('Choice controls')+`<div class="stack"><label class="checkbox"><input type="checkbox"> I agree to the terms</label><label class="checkbox"><input type="checkbox" checked> Enable alerts</label><div class="row"><label class="radio"><input type="radio" name="plan"> Starter</label><label class="radio"><input type="radio" name="plan" checked> Pro</label></div><div class="progress"><span style="width:72%"></span></div></div>`+end,
'forms-4':()=>title('Button variants')+`<div class="row">${button('Save changes')}${button('Preview','outline')}${button('Cancel','ghost')}</div>`+end,
'overlay-1':()=>title('Dialog')+`<div class="dialog-backdrop"><div class="dialog stack"><div><h3>Delete project?</h3><p class="muted">This cannot be undone.</p></div><div class="row" style="justify-content:flex-end">${button('Cancel','outline')}${button('Delete')}</div></div></div>`+end,
'overlay-2':()=>title('Tabs')+`<div class="tabs"><button class="tab active">Profile</button><button class="tab">Security</button></div><div class="tabpanel">Profile content</div>`+end,
'layout-1':()=>title('Box')+card('Content','subtle')+end,'layout-2':()=>title('Stack layout')+card(`<div class="stack"><h3>Account settings</h3><div class="row between"><span>Email alerts</span><label><input type="checkbox" checked aria-label="Email alerts"></label></div></div>`)+end,'layout-3':()=>title('XGroup')+`<div class="xgroup">${button('Day','outline')}${button('Week','outline')}${button('Month','outline')}</div>`+end,'layout-4':()=>title('Separator')+`<div class="stack"><span>Content above</span><hr class="sep"><span>Content below</span></div>`+end,
'sprinkles-1':()=>title('Token-powered styles')+card(`<div class="stack"><b>Token-powered styles</b><p class="muted">No handwritten CSS needed here.</p></div>`)+end,
'sprinkles-2':()=>title('Semantic size tokens','The proportions scale together')+`<div class="row"><div class="token-mark"></div><div><b style="font-size:clamp(16px,4vw,22px)">Projected scale</b><p class="muted">Fluid at every viewport width.</p></div></div>`+end,
'sprinkles-3':()=>title('Interaction conditions','Hover or focus the surface')+`<div class="panel interactive" tabindex="0">Hover or focus me</div>`+end,
'typography-1':()=>title('Text styles')+`<div class="stack"><strong>Strong emphasis</strong><p class="muted">Supporting copy</p></div>`+end,'typography-2':()=>title('Headings')+`<div class="stack"><h1 style="font-size:26px">Build faster</h1><h3>A short, readable description.</h3><p class="muted">Clear hierarchy without custom CSS.</p></div>`+end,'typography-3':()=>title('Paragraph')+`<p class="muted">A readable paragraph with semantic colour and comfortable line height.</p>`+end,
'visuals-1':()=>title('Named gradient')+card(`<div class="stack"><h3>Ship with confidence</h3><p>A named gradient without app-owned CSS.</p></div>`,'gradient')+end,'visuals-2':()=>title('Gradient text')+`<div class="gradient-text">Build the next thing</div>`+end,'visuals-3':()=>title('Animation')+card(`<div class="stack motion-card"><h3>Version 1.1 is here</h3><p class="pulse" style="color:#0f766e">New visual primitives included</p></div>`)+end,
'gradient-1':()=>title('Theme-aware gradient','Semantic and decorative stops together')+card(`<div class="stack"><h3>Theme-aware gradient</h3><p>primary → violet9 → cyan9</p></div>`,'gradient-dark')+end,
'gradient-2':()=>title('Same gradient, different theme scopes')+`<div class="stack"><div class="panel gradient-light">light: primary → primaryHover</div><div class="panel gradient-dark">midnight: primary → primaryHover</div></div>`+end,
'gradient-3':()=>title('Custom theme gradient')+card(`<div class="stack"><h3>Brand-aware banner</h3><p>primary → primaryActive</p></div>`,'gradient-brand')+end,
'gradient-4':()=>title('Gradient types')+`<div class="stack"><div class="panel gradient-radial">Radial</div><div class="panel gradient-conic">Conic</div></div>`+end,
'intro-1':()=>title('Quick start')+card(`<div class="stack"><h3>Welcome to Silva UI</h3><p class="muted">Theme-aware components ready for composition.</p>${button('Get started')}</div>`)+end,'install-2':()=>title('Hono JSX app','Server-rendered component output')+`<div class="server"><b>GET /</b> 200 OK<br>&lt;main&gt;Silva UI is ready.&lt;/main&gt;</div>`+end,'recipes-1':()=>title('Settings row')+card(`<div class="row between"><div><b>Email notifications</b><div class="muted small">Receive a summary of account activity.</div></div><input type="checkbox" checked aria-label="Email notifications"></div>`)+end,'recipes-2':()=>title('Empty state')+card(`<div class="stack" style="text-align:center;justify-items:center"><h3>No projects yet</h3><p class="muted">Create your first project to get started.</p>${button('Create project')}</div>`)+end,'recipes-3':()=>title('Toast')+`<div class="panel toast"><b>Changes saved</b><div class="muted">Your profile is up to date.</div></div>`+end,'recipes-4':()=>title('Theme preview')+`<div class="row"><div class="panel">light</div><div class="panel theme">dark</div><div class="panel" style="border-color:#14b8a6;color:#0f766e">emerald</div></div>`+end,'theming-1':()=>title('Built-in midnight theme')+card(`<div class="stack"><b>Dark themed content</b><p class="muted">Semantic tokens follow the active scope.</p></div>`,'theme')+end,'theming-2':()=>title('Custom semantic palette')+`<div class="panel" style="border-color:#ded7f5;background:#fff"><div class="stack"><p style="color:#6b6580">A custom semantic palette.</p><div>${button('Choose plan')}</div></div></div>`+end,
'default':()=>title('Silva UI example')+card(`<div class="stack"><h3>Live component preview</h3><p class="muted">This is the rendered visual result of the example.</p>${button('Try action')}</div>`)+end};
app.innerHTML=(previews[example]||previews.default)();app.addEventListener('click',(event)=>{const tab=event.target.closest('.tab');if(tab){tab.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');document.querySelector('.tabpanel').textContent=tab.textContent+' content';}});
</script></body></html>
